# RabbitMQ fuer das Scanner-Modul von "The Ship".
#
# Das Scanner-Modul auf dem Schiff verbindet sich fest auf 192.168.101.20:2014
# (siehe Cockpit -> Scanner -> doc). Darum laeuft der Broker als NodePort-Service
# auf genau diesem Port im k3s-Cluster des Schiffs.
#
# Deployen:
#   kubectl --kubeconfig <ship-kubeconfig> apply -f rabbitmq.yaml
# Status:
#   kubectl --kubeconfig <ship-kubeconfig> -n rabbitmq get pods,svc
# Management-UI:
#   http://192.168.101.20:2015  (guest/guest)
---
apiVersion: v1
kind: Namespace
metadata:
  name: rabbitmq
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: rabbitmq
data:
  # Die Schiffsmodule loggen sich ohne Passwort als "guest" ein. RabbitMQ laesst
  # guest normalerweise nur ueber loopback zu - das muss hier abgeschaltet werden.
  rabbitmq.conf: |
    loopback_users.guest = false
    listeners.tcp.default = 5672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: rabbitmq
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          volumeMounts:
            - name: config
              mountPath: /etc/rabbitmq/conf.d/20-theship.conf
              subPath: rabbitmq.conf
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: rabbitmq
spec:
  type: NodePort
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      nodePort: 2014      # so wie es das Scanner-Modul erwartet
    - name: management
      port: 15672
      targetPort: 15672
      nodePort: 2015
